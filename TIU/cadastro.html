<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | TIU</title><link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signup">
<header class="site-header"><div class="container nav-wrap">
  <a class="brand" href="index.html"><span class="brand-mark">TIU</span><span class="brand-text">TIU</span></a>
  <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>
  <nav class="main-nav" id="main-nav"><a href="index.html">Início</a><a href="profissionais.html">Profissionais</a><a href="produtos.html">Marketplace</a><span class="nav-divider"></span><a href="login.html">Entrar</a><a class="active btn btn-primary btn-sm" href="cadastro.html">Criar conta</a></nav>
</div></header>

<main class="auth-page"><div class="auth-card auth-card-wide">
  <div class="auth-heading"><span class="eyebrow">FAÇA PARTE</span><h1>Crie sua conta no TIU</h1><p>Escolha como você quer participar da plataforma.</p></div>
  <div class="account-type-grid" role="group" aria-label="Tipo de conta">
    <button type="button" class="account-type active" data-type="cliente"><span>◉</span><strong>Cliente</strong><small>Encontrar serviços e produtos.</small></button>
    <button type="button" class="account-type" data-type="profissional"><span>⚒</span><strong>Profissional</strong><small>Divulgar serviços e encontrar oportunidades.</small></button>
  </div>
  <form id="signup-form" novalidate>
    <input type="hidden" id="signup-type" value="cliente">
    <div class="form-row"><div class="form-field"><label for="signup-name">Nome</label><input id="signup-name" required placeholder="Seu nome"></div><div class="form-field"><label for="signup-location">Localização</label><input id="signup-location" required placeholder="Cidade / região"></div></div>
    <div class="form-row"><div class="form-field"><label for="signup-email">E-mail</label><input id="signup-email" type="email" required placeholder="voce@email.com"></div><div class="form-field"><label for="signup-password">Senha</label><input id="signup-password" type="password" minlength="6" required placeholder="Mínimo de 6 caracteres"></div></div>
    <div id="professional-fields" class="professional-fields hidden">
      <div class="form-row"><div class="form-field"><label for="signup-profession">Profissão</label><input id="signup-profession" placeholder="Ex.: Eletricista"></div><div class="form-field"><label for="signup-area">Área de atuação</label><input id="signup-area" placeholder="Ex.: Instalações residenciais"></div></div>
      <div class="form-field"><label for="signup-experience">Experiência</label><input id="signup-experience" placeholder="Ex.: 8 anos de experiência"></div>
      <div class="form-field"><label for="signup-description">Descrição profissional</label><textarea id="signup-description" rows="4" placeholder="Conte brevemente sobre seu trabalho..."></textarea></div>
    </div>
    <button class="btn btn-primary btn-block" id="signup-submit" type="submit">Criar conta</button>
    <div class="form-message" id="signup-message" role="alert"></div>
  </form>
  <p class="auth-switch">Já tem uma conta? <a href="login.html">Entrar</a></p>
  <p class="security-note">⚠ Os dados são armazenados somente no navegador com <code>localStorage</code> para fins de demonstração.</p>
</div></main>
<script src="js/app.js"></script></body></html>
